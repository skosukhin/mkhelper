[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mkhelper"
dynamic = ["version"]
description = "Helper scripts for Makefile-based build systems"
requires-python = ">=2.7, !=3.0.*, !=3.1.*"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "Sergey Kosukhin", email = "sergey.kosukhin@mpimet.mpg.de" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 2",
  "Programming Language :: Python :: 2.7",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
urls = { Homepage = "https://github.com/skosukhin/mkhelper" }

[project.scripts]
mkh-depgen = "mkhelper.depgen:main"
mkh-deplist = "mkhelper.deplist:main"
mkh-fortmodcmp = "mkhelper.fortmodcmp:main"

[tool.setuptools]
packages = ["mkhelper", "mkhelper.depgen"]
dynamic.version = { attr = "mkhelper.__version__" }

[tool.isort]
profile = "black"
skip_gitignore = true
line_length = 80

[tool.black]
line-length = 80

[tool.flake8]
max-line-length = 80
extend-ignore = ["E203"]
